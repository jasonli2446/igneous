name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: igneous, POSTGRES_PASSWORD: igneous, POSTGRES_DB: igneous }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U igneous" --health-interval 2s --health-retries 30
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q   # creates and migrates its own igneous_test database
      - name: Audit the locked dependencies for known advisories
        shell: bash   # -eo pipefail, so a failed export fails the step instead of auditing nothing
        run: uv export --frozen --no-hashes --no-emit-project | uvx pip-audit --strict --disable-pip --no-deps -r /dev/stdin

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build
      - name: Audit the locked dependencies for known advisories
        run: npm audit --audit-level=moderate
