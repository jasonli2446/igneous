[project]
name = "igneous"
version = "0.1.0"
description = "A creation layer for personal knowledge graphs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "fastembed>=0.5",
    "beautifulsoup4>=4.12",
    "anthropic>=1.15.0",
    "mcp>=2.3",
    "google-auth-oauthlib>=1.5.0",
    "google-api-python-client>=2.201.0",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.28"]

[project.scripts]
igneous = "igneous.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and Typer declare parameters this way by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
