services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: igneous
      POSTGRES_PASSWORD: igneous
      POSTGRES_DB: igneous
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igneous"]
      interval: 2s
      retries: 30

  api:
    build: ./api
    command: sh -c "alembic upgrade head && uvicorn igneous.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      IGNEOUS_DATABASE_URL: postgresql+psycopg://igneous:igneous@db:5432/igneous
      IGNEOUS_DATA_DIR: /data
    ports: ["8000:8000"]
    volumes: [./api/igneous:/app/igneous, ./data:/data, models:/root/.cache]
    depends_on: { db: { condition: service_healthy } }

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    volumes: [./web/src:/app/src]
    depends_on: [api]

volumes:
  pgdata:
  models:
